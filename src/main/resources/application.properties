spring.application.name=AutoCRM

spring.datasource.url=jdbc:postgresql://localhost:5432/autocrm
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Comma-separated browser origins allowed to call this API. Set the real frontend origin for deployment.
autocrm.security.allowed-origins=${AUTOCRM_ALLOWED_ORIGINS:http://localhost:5173}

# Store uploaded vehicle images outside the application directory by default.
autocrm.vehicle-images.storage-directory=${VEHICLE_IMAGE_STORAGE_DIRECTORY:${user.home}/.autocrm/vehicle-images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=14MB

jwt.secret=${JWT_SECRET}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
